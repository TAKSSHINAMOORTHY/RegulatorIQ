name: Keep-Warm Scheduled Job

on:
  schedule:
    # 10 irregular daily UTC cron entries mapped to Indian Standard Time (IST):
    # 01:40 UTC -> 07:10 IST
    - cron: "40 1 * * *"
    # 03:10 UTC -> 08:40 IST
    - cron: "10 3 * * *"
    # 04:35 UTC -> 10:05 IST
    - cron: "35 4 * * *"
    # 06:20 UTC -> 11:50 IST
    - cron: "20 6 * * *"
    # 07:45 UTC -> 13:15 IST
    - cron: "45 7 * * *"
    # 09:25 UTC -> 14:55 IST
    - cron: "25 9 * * *"
    # 10:50 UTC -> 16:20 IST
    - cron: "50 10 * * *"
    # 12:35 UTC -> 18:05 IST
    - cron: "35 12 * * *"
    # 14:10 UTC -> 19:40 IST
    - cron: "10 14 * * *"
    # 15:55 UTC -> 21:25 IST
    - cron: "55 15 * * *"
  workflow_dispatch:

concurrency:
  group: keep-warm-single
  cancel-in-progress: false

jobs:
  warmup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Execute keep-warm run
        env:
          WARMUP_TOKEN: ${{ secrets.WARMUP_TOKEN }}
          WARMUP_URLS: ${{ secrets.WARMUP_URLS }}
        run: |
          python scripts/warmup.py
