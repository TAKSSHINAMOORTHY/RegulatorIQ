name: Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-test:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run linter and formatting check
        run: make lint

      - name: Run typecheck
        run: make typecheck

      - name: Run backend tests with coverage
        run: make test-all

  web-test:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "web/package-lock.json"

      - name: Install web dependencies
        run: cd web && npm ci

      - name: Verify generated TypeScript types
        run: make web-types-check

      - name: Verify WCAG AA Contrast Ratios
        run: cd web && npm run contrast

      - name: Run web unit & component tests
        run: cd web && npm test

      - name: Build Next.js production bundle
        run: make web-build
