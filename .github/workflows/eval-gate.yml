name: Evaluation Gate

on:
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Synthetic Eval Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -e ".[dev]"
          make eval-gate
