services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: regulatoriq-api:local
    ports:
      - "8000:7860"
    environment:
      - PORT=7860
      - ENVIRONMENT=development
      - LOG_LEVEL=INFO
    volumes:
      - ../artifacts:/app/artifacts:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: regulatoriq-web:local
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
